
# BANCO POSTGRESQL EXCLUSIVO PARA TESTES
spring.datasource.url=jdbc:postgresql://localhost:5432/meu_imovel_test
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

# FLYWAY - MIGRATIONS NO BANCO DE TESTES
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/meu_imovel_test
spring.flyway.user=${TEST_DB_USERNAME}
spring.flyway.password=${TEST_DB_PASSWORD}

# HIBERNATE - SCHEMA CONTROLADO PELO FLYWAY
spring.jpa.hibernate.ddl-auto=none

# JWT - CONFIGURACAO ISOLADA
SUPABASE_URL=https://supabase.invalid
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://supabase.invalid/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://supabase.invalid/auth/v1/.well-known/jwks.json
# STORAGE SUPABASE - VALORES FICTICIOS PARA TESTES
SUPABASE_SECRET_KEY=test-storage-key-not-valid